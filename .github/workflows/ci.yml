name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend (lint, types, i18n, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build

  docker:
    name: Frontend Docker image
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - run: docker build . --tag plantpulse-frontend:ci
